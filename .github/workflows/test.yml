name: test
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m py_compile *.py
      - name: Icon regression tests (flags + topics)
        run: python tests/test_flags.py
      - name: Breaking-gate regression tests
        run: python tests/test_breaking.py
